name: 'oms_analytics'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  oms_analytics:
    +schema: transform
    +materialized: table
    +transient: false

    customer_rev:
      +meta:
        pre_hook: "{{ log_start_time(this) }}"
        post_hook: "{{ log_end_time(this) }}"

    hooks-demo:
      cust_orders_11:
        +meta:
          pre_hook: |
            INSERT INTO audit.model_runs (model_name, run_type, run_timestamp)
            VALUES ('{{ this }}', 'start', CURRENT_TIMESTAMP)
          post_hook: |
            INSERT INTO audit.model_runs (model_name, run_type, run_timestamp)
            VALUES ('{{ this }}', 'end', CURRENT_TIMESTAMP)